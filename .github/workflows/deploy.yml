name: Deploy Lambda

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Verify Node version
      - name: Verify Node Version
        run: node -v

      # Install zip utility
      - name: Install ZIP Utility
        run: sudo apt-get update && sudo apt-get install -y zip

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      - name: Build Lambdas
        run: node scripts/build.js

      - name: Package Lambdas
        run: node scripts/package.js

      # Verify ZIP file
      - name: Verify Package
        run: |
          ls -lh build
          unzip -l build/lambda.zip | head -50

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy all Lambda functions
      - name: Deploy All Lambda Functions
        env:
          FUNCTIONS: "createTodo getTodos getTodoById updateTodo deleteTodo"

        run: |
          for FUNCTION in $FUNCTIONS
          do
            echo "=========================================="
            echo "Deploying $FUNCTION..."
            echo "=========================================="

            aws lambda update-function-code \
              --function-name "$FUNCTION" \
              --zip-file fileb://build/lambda.zip

            echo "✅ Successfully deployed $FUNCTION"
          done

      - name: Deployment Success
        run: echo "🎉 All Lambda functions deployed successfully!"