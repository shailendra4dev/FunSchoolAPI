- name: Deploy All Lambda Functions
  run: |
    FUNCTIONS=(
      createTodo
      getTodos
      getTodoById
      updateTodo
      deleteTodo
    )

    for FUNCTION in "${FUNCTIONS[@]}"
    do
      echo "======================================"
      echo "Deploying: $FUNCTION"
      echo "======================================"

      aws lambda update-function-code \
        --function-name "$FUNCTION" \
        --zip-file fileb://function.zip

      echo "Successfully deployed $FUNCTION"
    done