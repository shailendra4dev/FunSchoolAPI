name: Deploy AWS Infrastructure

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy

    runs-on: ubuntu-latest

    timeout-minutes: 30

    defaults:
      run:
        working-directory: terraform

    steps:
      #--------------------------------------------
      # Checkout Repository
      #--------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      #--------------------------------------------
      # Setup Node.js
      #--------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Node Version
        run: node -v
        working-directory: .

      #--------------------------------------------
      # Install Dependencies
      #--------------------------------------------
      - name: Install Dependencies
        run: npm ci
        working-directory: .

      #--------------------------------------------
      # Build Lambda Functions
      #--------------------------------------------
      - name: Build Lambda Functions
        run: npm run build
        working-directory: .

      #--------------------------------------------
      # Verify Build Output
      #--------------------------------------------
      - name: Verify Build
        run: ls -la dist
        working-directory: .

      #--------------------------------------------
      # Setup Terraform
      #--------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Verify Terraform Version
        run: terraform version

      #--------------------------------------------
      # Configure AWS Credentials
      #--------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      #--------------------------------------------
      # Verify AWS Login
      #--------------------------------------------
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      #--------------------------------------------
      # Select Environment
      #--------------------------------------------
      - name: Select Deployment Environment
        shell: bash
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "TFVARS=prod.tfvars" >> $GITHUB_ENV
            echo "BACKEND=backend-prod.hcl" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "TFVARS=dev.tfvars" >> $GITHUB_ENV
            echo "BACKEND=backend-dev.hcl" >> $GITHUB_ENV
          fi

      - name: Show Selected Environment
        run: |
          echo "Environment : $ENVIRONMENT"
          echo "Backend File: $BACKEND"
          echo "TFVars File : $TFVARS"

      #--------------------------------------------
      # Terraform Init
      #--------------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config=$BACKEND

      #--------------------------------------------
      # Terraform Format Check
      #--------------------------------------------
      - name: Terraform Format
        run: terraform fmt -check

      #--------------------------------------------
      # Terraform Validate
      #--------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      #--------------------------------------------
      # Terraform Plan
      #--------------------------------------------
      - name: Terraform Plan
        env:
          TF_INPUT: "false"
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=$TFVARS \
            -out=tfplan

      #--------------------------------------------
      # Terraform Apply
      #--------------------------------------------
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      #--------------------------------------------
      # Deployment Complete
      #--------------------------------------------
      - name: Deployment Complete
        run: |
          echo "=================================="
          echo "Deployment completed successfully!"
          echo "Environment : $ENVIRONMENT"
          echo "=================================="